<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
:root{--zemin:#fffdf8;--yazi:#1b1a17;--soluk:#62605a;--cizgi:#e3ded3;--vurgu:#1f5f4a}
@media (prefers-color-scheme:dark){:root{--zemin:#1a1a17;--yazi:#efede6;--soluk:#a7a399;--cizgi:#34322d;--vurgu:#7fcfb0}}
body{margin:0;width:300px;background:var(--zemin);color:var(--yazi);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:14px}
h1{font-size:17px;margin:0 0 2px}
p{margin:0 0 10px;color:var(--soluk);font-size:13px}
.satir{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
button{font:inherit;font-weight:600;padding:11px 8px;border-radius:10px;border:1.5px solid var(--cizgi);background:var(--zemin);color:var(--yazi);cursor:pointer}
button.ana{grid-column:1/-1;background:var(--vurgu);color:var(--zemin);border-color:var(--vurgu);font-size:17px}
button:focus-visible{outline:3px solid #f2b01e;outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 2px}
input[type=range]{width:100%}
#bilgi{font-size:12.5px;color:var(--soluk);border-top:1px solid var(--cizgi);padding-top:8px;margin-top:8px}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--cizgi);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<h1>Sesli Oku</h1>
<p>Sayfanın asıl metnini Türkçe okur. Hiçbir şey dışarı gönderilmez.</p>
<div class="satir">
  <button class="ana" id="oku">▶ Oku / Duraklat</button>
  <button id="onceki">⏮ Önceki</button>
  <button id="sonraki">Sonraki ⏭</button>
  <button id="dur">■ Durdur</button>
  <button id="gorunum">Aa Büyük yazı</button>
</div>
<label for="hiz">Okuma hızı <span id="hiz-deger">1,0×</span></label>
<input id="hiz" type="range" min="0.5" max="2" step="0.1" value="1">
<div id="bilgi">Sayfa inceleniyor…</div>
<p style="margin-top:8px">Kısayollar: <kbd>Alt+Shift+O</kbd> oku, <kbd>Alt+Shift+N</kbd>/<kbd>B</kbd> sonraki/önceki, <kbd>Alt+Shift+K</kbd> büyük yazı.</p>
<script src="panel.js"></script>
</body>
</html>
